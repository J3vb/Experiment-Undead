name: Server image

# Reusable: builds the dedicated server Docker image from the exported
# server artifact, checks it boots and stops cleanly, then pushes to GHCR.
on:
  workflow_call:
    inputs:
      version:
        description: Game version (from export.yml)
        type: string
        required: true
      tags:
        description: Space-separated image tags to push
        type: string
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download server build
        uses: actions/download-artifact@v4
        with:
          pattern: ExperimentUndead-*-server
          path: deploy/server/server
          merge-multiple: true

      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/experiment-undead-server"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image:ci" deploy/server

      - name: Smoke test container
        run: |
          docker run -d --name smoke "$IMAGE:ci"
          for _ in $(seq 1 40); do
            docker logs smoke 2>&1 | grep -q "Server ready" && break
            sleep 0.5
          done
          docker stop smoke
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "Server ready"
          docker logs smoke 2>&1 | grep -q "Server stopped"
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = "0"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Remove old untagged images (keep 5)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: experiment-undead-server
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"
