name: Assets

on:
  pull_request:
    paths:
      - "tools/assets/**"
      - "assets/models/**"
      - ".github/workflows/assets.yml"

jobs:
  build-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/assets/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/assets/package-lock.json

      - name: Install Blender as a Python module and the glTF validator
        run: |
          pip install -r tools/assets/requirements.txt
          npm ci --prefix tools/assets

      - name: Build every model headless
        run: |
          python tools/assets/build_models.py --out "$RUNNER_TEMP/models"
          for f in kit/wall_panel.glb weapons/rifle_ar.glb weapons/hollis_44.glb weapons/mako_pdw.glb \
            weapons/atlas_auto.glb weapons/halberd_lmg.glb weapons/corvid_338.glb weapons/siphon.glb zombies/shambler.glb \
            zombies/crawler.glb zombies/bloater.glb characters/player.glb characters/player_arms.glb; do
            test -s "$RUNNER_TEMP/models/$f" || { echo "missing $f"; exit 1; }
          done
          for name in charm_dog_tags charm_vial charm_keycard charm_dosimeter charm_coin implant_reflex implant_lung implant_spine implant_ocular implant_relay; do
            test -s "$RUNNER_TEMP/models/gear/$name.glb" || { echo "missing gear/$name.glb"; exit 1; }
          done
          for f in gear/vest_light.glb gear/vest_medium.glb gear/vest_heavy.glb; do
            test -s "$RUNNER_TEMP/models/$f" || { echo "missing $f"; exit 1; }
          done

      - name: Khronos glTF validator (fresh build and committed models)
        run: |
          node tools/assets/validate_gltf.mjs "$RUNNER_TEMP/models"
          node tools/assets/validate_gltf.mjs assets/models

      - name: Model rules (budget, origin, forward axis, joints, normals, materials)
        run: |
          python tools/assets/check_models.py --dir "$RUNNER_TEMP/models"
          python tools/assets/check_models.py --dir assets/models

      - name: Tests for the model checks
        run: |
          python -m pytest tools/assets/tests -q -p no:cacheprovider
          node --test tools/assets/tests/validate_gltf.test.mjs
