name: Assets

on:
  pull_request:
    paths:
      - "tools/assets/**"
      - "assets/models/**"
      - ".github/workflows/assets.yml"

jobs:
  build-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/assets/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/assets/package-lock.json

      - name: Install Blender as a Python module and the glTF validator
        run: |
          pip install -r tools/assets/requirements.txt
          npm ci --prefix tools/assets

      - name: Build every model headless
        run: |
          python tools/assets/build_models.py --out "$RUNNER_TEMP/models"
          for f in kit/wall_panel.glb weapons/rifle_ar.glb weapons/hollis_44.glb weapons/mako_pdw.glb \
            weapons/atlas_auto.glb weapons/halberd_lmg.glb weapons/bastion_lmg.glb weapons/corvid_338.glb \
            weapons/cryo_lance.glb weapons/synapse.glb \
            weapons/sentry_br3.glb weapons/nightjar_sd.glb weapons/rampart_br.glb \
            weapons/fieldhand_lever.glb weapons/ironwood_50.glb \
            weapons/warden_p9.glb weapons/wren_mp.glb weapons/siphon.glb \
            weapons/coachman_2b.glb weapons/grubber_sawnoff.glb zombies/shambler.glb \
            zombies/crawler.glb zombies/bloater.glb characters/player.glb characters/player_arms.glb \
            props/specimen_tank.glb props/lab_bench.glb props/jar_shelf.glb props/filing_cabinets.glb \
            props/mess_table.glb props/serving_counter.glb props/guard_desk.glb props/locker_row.glb \
            props/generator.glb props/holding_cell.glb props/supply_truck.glb props/crate_stack.glb \
            props/crate_long.glb props/crate_large.glb props/fuel_drum.glb props/forklift.glb \
            dressing/lab_papers.glb dressing/mess_spill.glb dressing/pipe_run_3.glb dressing/pipe_run_6.glb \
            props/barricade.glb props/covered_gurney.glb dressing/hazard_sign.glb dressing/body_bag.glb \
            doors/bulkhead_door.glb doors/bulkhead_door_wide.glb; do
            test -s "$RUNNER_TEMP/models/$f" || { echo "missing $f"; exit 1; }
          done
          for name in charm_dog_tags charm_vial charm_keycard charm_dosimeter charm_coin implant_reflex implant_lung implant_spine implant_ocular implant_relay; do
            test -s "$RUNNER_TEMP/models/gear/$name.glb" || { echo "missing gear/$name.glb"; exit 1; }
          done
          for name in street_lamp wall_lantern window_lit window_dark fence signpost; do
            test -s "$RUNNER_TEMP/models/town/$name.glb" || { echo "missing town/$name.glb"; exit 1; }
          done
          for f in gear/vest_light.glb gear/vest_medium.glb gear/vest_heavy.glb; do
            test -s "$RUNNER_TEMP/models/$f" || { echo "missing $f"; exit 1; }
          done

      - name: Khronos glTF validator (fresh build and committed models)
        run: |
          node tools/assets/validate_gltf.mjs "$RUNNER_TEMP/models"
          node tools/assets/validate_gltf.mjs assets/models

      - name: Model rules (budget, origin, forward axis, joints, normals, materials)
        run: |
          python tools/assets/check_models.py --dir "$RUNNER_TEMP/models"
          python tools/assets/check_models.py --dir assets/models

      - name: Tests for the model checks
        run: |
          python -m pytest tools/assets/tests -q -p no:cacheprovider
          node --test tools/assets/tests/validate_gltf.test.mjs
