name: Review

# Claude reviews pull requests written by Codex (branches starting with codex/).
# Codex reviews the other pull requests through its own GitHub code review setting.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md and docs/KEEP_IT_SIMPLE.md first;
            they are the rules this code must follow.

            Look for, in this order:
            1. Bugs and broken game logic, including multiplayer rules in AGENTS.md
               (authority checks, InputFrame, GameSession.rng, Spawner).
            2. Missing or weak tests for the behaviour that changed.
            3. Over-engineering against the Keep it simple rules.
            4. Performance problems in per-frame code (allocations, get_node in loops).

            Post each real problem as an inline comment on the exact line, starting with
            "Blocking:" if it must be fixed before merge or "Suggestion:" if optional.
            Do not comment on formatting or style; CI checks that.
            Then post one short top-level comment: a verdict line
            ("No blocking issues" or "N blocking issues") and at most 5 bullets.
            If there are blocking issues, end the top-level comment with the line
            "@codex please fix the Blocking comments above and push to this branch."
            Never approve or merge the pull request.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
